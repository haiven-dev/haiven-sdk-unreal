name: Encrypted Unreal plugin shadow build
run-name: Shadow build ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Public run correlation ID
        type: string
        required: true
      request:
        description: Approved encrypted diffs, public bases, and output recipient
        type: string
        required: true

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  request:
    if: >-
      github.repository == 'haiven-dev/haiven-sdk-unreal' && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main' && github.ref_protected && github.run_attempt == '1'
      && vars.SDK_SHADOW_DISPATCH_ACTOR_ID != '' && github.actor_id == vars.SDK_SHADOW_DISPATCH_ACTOR_ID
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      request_id: ${{ steps.plan.outputs.request_id }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Require a pinned shared builder
        env:
          BUILDER_SHA: ${{ vars.SDK_SHADOW_BUILDER_SHA }}
        shell: bash
        run: '[[ "$BUILDER_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: haiven-dev/haiven-sdk-cpp
          ref: ${{ vars.SDK_SHADOW_BUILDER_SHA }}
          path: builder
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - id: plan
        name: Validate the request for Unreal plugin
        env:
          EXPECTED_TARGET: 'unreal'
          SHADOW_REQUEST: ${{ inputs.request }}
          DISPLAY_ID: ${{ inputs.request_id }}
          # Runner labels for the jobs no standard runner can hold the engine for.
          # Pull-request jobs use their own labels; the plan refuses a label
          # that equals the other lane's, so the lanes never share a runner.
          SDK_SHADOW_RUNNER_LINUX_X64: ${{ vars.SDK_SHADOW_RUNNER_LINUX_X64 }}
          SDK_SHADOW_RUNNER_WINDOWS_X64: ${{ vars.SDK_SHADOW_RUNNER_WINDOWS_X64 }}
          SDK_SHADOW_RUNNER_MACOS: ${{ vars.SDK_SHADOW_RUNNER_MACOS }}
          SDK_SHADOW_PR_RUNNER_LINUX_X64: ${{ vars.SDK_SHADOW_PR_RUNNER_LINUX_X64 }}
          SDK_SHADOW_PR_RUNNER_WINDOWS_X64: ${{ vars.SDK_SHADOW_PR_RUNNER_WINDOWS_X64 }}
          SDK_SHADOW_PR_RUNNER_MACOS: ${{ vars.SDK_SHADOW_PR_RUNNER_MACOS }}
        shell: bash
        run: |
          [[ "$DISPLAY_ID" == "$(jq -r .request_id <<< "$SHADOW_REQUEST")" ]]
          python builder/.github/shadow-build/build.py plan

  build:
    # Linux builds from Epic's pinned engine image on a standard runner.
    # Every other job runs on the runner label the plan names; that runner
    # already holds Unreal Engine 5.8.2 and exports UNREAL_ENGINE_ROOT.
    name: Shadow build / ${{ matrix.platform }}
    needs: request
    # shadow-source for main stages, shadow-source-pr for pull-request stages:
    # each holds its own source key, so unmerged code never runs beside main's.
    environment: ${{ needs.request.outputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.request.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: haiven-dev/haiven-sdk-cpp
          ref: ${{ vars.SDK_SHADOW_BUILDER_SHA }}
          path: builder
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.request.outputs.base_sha }}
          path: source
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install pinned age
        shell: bash
        run: go install filippo.io/age/cmd/age@v1.3.2
      - name: Verify and reconstruct approved source
        env:
          SHADOW_REQUEST: ${{ inputs.request }}
          SDK_SHADOW_SOURCE_AGE_IDENTITY: ${{ secrets.SDK_SHADOW_SOURCE_AGE_IDENTITY }}
        shell: bash
        run: |
          go_bin="$(go env GOPATH)/bin"
          export PATH="$go_bin:$PATH"
          python builder/.github/shadow-build/build.py reconstruct --source source \
            --dotnet source --verification "$RUNNER_TEMP/shadow-source.json"
      - name: Install the pinned Unreal Engine from Epic's image
        if: matrix.image != ''
        env:
          IMAGE: ${{ matrix.image }}
          EPIC_GHCR_TOKEN: ${{ secrets.EPIC_GHCR_TOKEN }}
        shell: bash
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/epicgames/unreal-engine:dev-slim-[0-9.]+@sha256:[0-9a-f]{64}$ ]]
          [[ -n "$EPIC_GHCR_TOKEN" ]] || { echo "Set EPIC_GHCR_TOKEN in this run's shadow-source or shadow-source-pr environment." >&2; exit 1; }
          # The engine does not fit beside the preinstalled toolchains on the root disk.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          engine=/mnt/unreal-engine
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$engine"
          go_bin="$(go env GOPATH)/bin"
          export PATH="$go_bin:$PATH"
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          login="$(GH_TOKEN="$EPIC_GHCR_TOKEN" gh api user --jq .login)"
          printf '%s' "$EPIC_GHCR_TOKEN" | crane auth login ghcr.io --username "$login" --password-stdin >/dev/null
          # Stream the flattened image and keep only the engine directory. The image
          # also carries a build-accelerator cache that expands far beyond the disk.
          set -o pipefail
          crane export --platform linux/amd64 "$IMAGE" - \
            | tar -x -C "$engine" --strip-components=3 --wildcards 'home/ue4/UnrealEngine/*'
          crane auth logout ghcr.io >/dev/null
          df -h / /mnt
          printf 'UNREAL_ENGINE_ROOT=%s\n' "$engine" >> "$GITHUB_ENV"
      - id: build
        name: Build and seal results
        env:
          SHADOW_REQUEST: ${{ inputs.request }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          go_bin="$(go env GOPATH)/bin"
          export PATH="$go_bin:$PATH"
          python builder/.github/shadow-build/build.py build --platform "$PLATFORM" --source source \
            --dotnet source --verification "$RUNNER_TEMP/shadow-source.json" \
            --work "$RUNNER_TEMP/shadow-build" --bundle "$RUNNER_TEMP/build.age"
      - name: Retain encrypted results
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shadow-${{ needs.request.outputs.request_id }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/build.age
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Remove the reconstructed source
        if: always()
        shell: bash
        run: |
          python -c 'import shutil, sys; from pathlib import Path; shutil.rmtree("source", ignore_errors=True); Path(sys.argv[1]).unlink(missing_ok=True)' "$RUNNER_TEMP/shadow-source.json"
