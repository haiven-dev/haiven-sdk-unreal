name: Release

# Publishes a GitHub release for a `v*` tag: the plugin source bundle plus a
# prebuilt Linux plugin per engine in ci/engines.json, with SHA256SUMS.
#
# SECURITY: this repository is public and the binary job runs on self-hosted
# runners. Never add a `pull_request` or `pull_request_target` trigger here.
# Only people with write access can push a tag or dispatch a workflow, so fork
# code never reaches a self-hosted runner through this file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.2.3). Empty = dry run of the selected branch at its VersionName."
        required: false
        default: ""
      publish:
        description: "Create or update the GitHub release (requires tag)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # The tag being released, or empty for a dispatched dry run.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  # What every job checks out: the dispatched tag, or the ref that triggered the run.
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  source:
    name: Source bundle
    if: github.repository == 'haiven-dev/haiven-sdk-unreal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - name: Check the tag against Haiven.uplugin VersionName
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ] && [ -z "$RELEASE_TAG" ]; then
            echo "::error::publishing needs a tag; dispatch with the tag input set"
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ]; then
            version="$(python3 ci/release.py version --tag "$RELEASE_TAG")"
          else
            version="$(python3 ci/release.py version)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version $version (tag: ${RELEASE_TAG:-none, dry run})"
      - name: Release script tests
        run: python3 -m unittest discover -s ci -p 'test_release.py' -v
      - name: Binary matrix from ci/engines.json
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(python3 ci/release.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"
      - name: Build source zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 ci/release.py source --version "$VERSION" --out dist
          python3 -m zipfile -l dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: dist/
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: Unreal ${{ matrix.version }} ${{ matrix.platform }} binaries
    needs: source
    # Rows come from ci/engines.json (Linux, one per engine). Win64 and Mac are
    # not built: they need a Windows (RunUAT.bat, -TargetPlatforms=Win64) or
    # macOS host with the engine installed, registered with its own label, and
    # a matching runs-on below. Until then those assets are not published.
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: [self-hosted, linux, x64, "${{ matrix.label }}"]
    timeout-minutes: 75
    env:
      UNREAL_ENGINE_ROOT: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          clean: true
      - name: BuildPlugin (RunUAT) for ${{ matrix.platform }}
        env:
          ENGINE: ${{ matrix.version }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist build/release-logs
          python3 ci/release.py binary --engine "$ENGINE" --version "$VERSION" --platform "$PLATFORM" --out dist --logs build/release-logs
          python3 -m zipfile -l dist/*.zip
      - name: Preserve BuildPlugin log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildplugin-logs-UE${{ matrix.ue }}-${{ matrix.platform }}
          path: build/release-logs/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-UE${{ matrix.ue }}-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [source, binaries]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
              --verify-tag --title "Haiven Unreal plugin $VERSION" --generate-notes "${prerelease[@]}"
          fi
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name'
