name: Build

# Engine-free checks. Prebuilt Linux plugins stay in release.yml, which runs
# only on a v* tag or a manual dispatch, and only on this repository's
# self-hosted runners. Do not add a pull_request trigger to release.yml.
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: C++ protocol check
        run: ./verify.sh
      - name: Plugin descriptor
        run: node validate-plugin.mjs
      - name: Release and report tests
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v
